<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Готовые примеры — Петли стаи</title>
  <link href="../page.css" rel="stylesheet"/>
  <style>
    body {
      background: #f1f3f8;
      color: #111827;
      font-family: "Manrope", "Segoe UI", sans-serif;
      padding: 24px;
      font-size: 16px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }
    .lead {
      margin: 0 0 18px;
      color: #4b5563;
    }
    .example-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      margin-bottom: 18px;
    }
    .example {
      width: 180px;
      height: 180px;
      cursor: pointer;
      transform: scale(1);
      transition: transform 0.2s ease;
    }
    .example:hover {
      transform: scale(1.05);
    }
    .example-circle {
      width: 180px;
      height: 180px;
      border-radius: 999px;
      background: var(--color);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 20px;
      text-align: center;
      padding: 18px;
      box-sizing: border-box;
    }
    .example-list {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }
    .example-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #ffffff;
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06);
      position: relative;
    }
    .example-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 12px;
      bottom: 12px;
      width: 4px;
      border-radius: 999px;
      background: var(--accent, #1f2937);
    }
    .example-card strong {
      display: block;
      font-size: 16px;
    }
    .example-card span {
      display: block;
      color: #6b7280;
      font-size: 14px;
      margin-top: 4px;
    }
    .example-card button {
      border: 0;
      background: var(--accent, #1f2937);
      color: #ffffff;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
    }
    .example-card button:hover {
      filter: brightness(1.05);
    }
    .hint {
      margin-top: 16px;
      color: #6b7280;
      font-size: 14px;
      text-align: center;
    }
    @media (max-width: 640px) {
      .example-card {
        flex-direction: column;
        align-items: flex-start;
      }
      .example-card button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <h1>Готовые примеры</h1>
  <p class="lead">Выберите модель и посмотрите, как работают петли причин и следствий.</p>

  <div class="example-grid" id="circleGrid"></div>

  <div class="example-list" id="exampleList"></div>

  <div class="hint">После открытия нажмите «Запуск», чтобы увидеть динамику.</div>

  <script>
    const examples = [
      {
        id: "trust-loop",
        title: "Доверие и открытость",
        note: "Открытость укрепляет доверие, но риски могут его снизить.",
        color: "#d14b4b"
      },
      {
        id: "stress-sleep",
        title: "Стресс и сон",
        note: "Плохой сон повышает стресс, а стресс ухудшает сон.",
        color: "#5aa6ff"
      },
      {
        id: "pack-growth",
        title: "Рост стаи",
        note: "Численность влияет на добычу и стабильность среды.",
        color: "#66bb6a"
      },
      {
        id: "focus-fatigue",
        title: "Фокус и усталость",
        note: "Результаты поднимают усталость, отдых возвращает фокус.",
        color: "#a78bfa"
      },
      {
        id: "resource-plan",
        title: "Ресурсы и планирование",
        note: "План помогает снижать риски и беречь ресурс.",
        color: "#f59e0b"
      }
    ];

    const circleGrid = document.getElementById("circleGrid");
    const list = document.getElementById("exampleList");

    const loadExample = async (id) => {
      try {
        const response = await fetch(`/loopy/examples/${id}.json`);
        if (!response.ok) return;
        const example = await response.json();
        const data = example.data || example;
        window.parent.postMessage({ type: "loopy-load-example", data }, window.location.origin);
        const modalBg = window.parent.document.getElementById("modal_bg");
        if (modalBg) modalBg.click();
      } catch (error) {
        // noop
      }
    };

    examples.forEach((example) => {
      const circle = document.createElement("div");
      circle.className = "example";
      circle.dataset.id = example.id;
      circle.innerHTML = `<div class="example-circle">${example.title.replace(" ", "<br>")}</div>`;
      const circleInner = circle.querySelector(".example-circle");
      if (circleInner) circleInner.style.background = example.color;
      circle.addEventListener("click", () => loadExample(example.id));
      circleGrid.appendChild(circle);

      const card = document.createElement("div");
      card.className = "example-card";
      card.style.setProperty("--accent", example.color);
      card.innerHTML = `
        <div>
          <strong>${example.title}</strong>
          <span>${example.note}</span>
        </div>
        <button type="button">Открыть пример</button>
      `;
      card.querySelector("button").addEventListener("click", () => loadExample(example.id));
      list.appendChild(card);
    });
  </script>
</body>
</html>
